        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    scheme:
      gatherCoverageData: false
